<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trattoria Bella Napoli - Homepage</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #1c1917;
      color: #f5f5f4;
      line-height: 1.6;
    }
    header {
      background: #0c0a09;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292524;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      color: #ea580c;
    }
    .hero {
      text-align: center;
      padding: 80px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 16px;
      color: #ffffff;
    }
    p {
      color: #a8a29e;
      font-size: 16px;
    }
    .cta-box {
      margin-top: 40px;
      background: #292524;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #44403c;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🍕 Trattoria Bella Napoli</div>
    <div>Bestehende Restaurant-Homepage</div>
  </header>

  <div class="hero">
    <h1>Original neapolitanische Steinofenpizza</h1>
    <p>Frische Zutaten, 48h gereifter Teig und traditionelle Rezepte seit 1984.</p>

    <div class="cta-box">
      <h3>👉 Schau unten rechts auf den Bildschirm!</h3>
      <p>Dort schwebt der dynamisch geladene Button <strong>„🍕 Pizza online bestellen ➔“</strong>.</p>
    </div>
  </div>

  <!-- DAS IST DER EINZIGE CODE, DEN DAS RESTAURANT EINFÜGEN MUSS: -->
  <script 
    src="http://localhost:3000/embed.js" 
    data-restaurant="pizzeria-bella-napoli" 
    data-color="#ea580c" 
    data-label="🍕 Pizza online bestellen" 
    data-position="right">
  </script>

</body>
</html>
